name: Application checks
on: [push, pull_request]
permissions:
  contents: read
  
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          
      - run: npm ci
      
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-8.2
          
      - run: npm test
      
      - run: npm run build